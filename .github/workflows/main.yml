          </manifest>
          ''',

              "app/src/main/res/xml/automotive_app_desc.xml": '''<?xml version="1.0" encoding="utf-8"?>
          <automotiveApp>
              <uses name="template" />
          </automotiveApp>
          ''',

              "app/src/main/res/xml/shortcuts.xml": '''<?xml version="1.0" encoding="utf-8"?>
          <shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
              <shortcut
                  android:shortcutId="quick_refill_200dh"
                  android:enabled="true"
                  android:shortcutShortLabel="@string/shortcut_200dh_short"
                  android:shortcutLongLabel="@string/shortcut_200dh_long">
                  <intent
                      android:action="android.intent.action.VIEW"
