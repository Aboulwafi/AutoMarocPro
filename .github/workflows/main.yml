name: Build AutoMaroc Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Clean Android Project Files
        pythonLocation: python3
        run: |
          python3 - << 'PYEOF'
          import os

          files = {
              "settings.gradle.kts": '''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoMarocPro"
          include(":app")
          ''',

              "build.gradle.kts": '''plugins {
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          ''',

              "gradle.properties": '''org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          ''',

              "app/build.gradle.kts": '''plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "ma.automaroc.pro"
              compileSdk = 34

              defaultConfig {
                  applicationId = "ma.automaroc.pro"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0-MoroccanEdition"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.car.app:app:1.4.0")
              implementation("androidx.car.app:app-projected:1.4.0")
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("com.google.android.gms:play-services-location:21.1.0")
          }
          ''',

              "app/src/main/AndroidManifest.xml": '''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="com.google.android.gms.permission.CAR_SPEED" />
              <uses-permission android:name="com.google.android.gms.permission.CAR_MILEAGE" />
              <uses-permission android:name="com.google.android.gms.permission.CAR_FUEL" />
              <uses-permission android:name="androidx.car.app.MAP_TEMPLATES" />
              <uses-permission android:name="androidx.car.app.NAVIGATION_TEMPLATES" />
              <uses-permission android:name="androidx.car.app.ACCESS_SURFACE" />

              <application
                  android:allowBackup="true"
                  android:label="AutoMaroc Pro"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.DarkActionBar">

                  <meta-data
                      android:name="com.google.android.gms.car.application"
                      android:resource="@xml/automotive_app_desc" />

                  <meta-data
                      android:name="androidx.car.app.minCarApiLevel"
                      android:value="1" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="AutoMaroc Pro">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <meta-data
                          android:name="android.app.shortcuts"
